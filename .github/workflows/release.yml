name: Release

# Pushing a tag such as v0.1.0 builds a signed APK and publishes it as a GitHub release, with its
# SHA-256 checksum and latest.json, the manifest the app's built-in updater reads from the latest
# release. Publishing here is what delivers an update to everyone. Pre-releases are skipped.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NDK_VERSION: 26.1.10909125

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply core patches
        run: sh scripts/apply-core-patches.sh
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^dayweave.version=//p' gradle.properties)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match dayweave.version=${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already has the Android SDK. Only the NDK version the build expects is added.
      - name: Install the NDK
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYWEAVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "The DAYWEAVE_KEYSTORE_BASE64 secret isn't set, so a signed release can't be built" >&2
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "DAYWEAVE_KEYSTORE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          DAYWEAVE_KEYSTORE_PASSWORD: ${{ secrets.DAYWEAVE_KEYSTORE_PASSWORD }}
          DAYWEAVE_KEY_ALIAS: ${{ secrets.DAYWEAVE_KEY_ALIAS }}
          DAYWEAVE_KEY_PASSWORD: ${{ secrets.DAYWEAVE_KEY_PASSWORD }}
        run: ./gradlew --console=plain testReleaseUnitTest assembleRelease
      - name: Write the checksum, release notes and update manifest
        run: |
          mkdir dist
          apk="Dayweave-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${apk}"
          sed -n "/^## ${VERSION}/,/^## /{/^## /!p}" CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          cd dist
          sha256sum "${apk}" > "${apk}.sha256"
          jq -n --arg version "${VERSION}" --arg apk "${apk}" --argjson size "$(stat -c %s "${apk}")" \
            --arg sha256 "$(cut -d' ' -f1 "${apk}.sha256")" --rawfile notes ../notes.md \
            '{version: $version, apk: $apk, size: $size, sha256: $sha256, notes: ($notes | gsub("^\\s+|\\s+$"; ""))}' \
            > latest.json
          cat latest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Dayweave ${VERSION} for Android" \
            --notes-file notes.md --verify-tag
      - name: Remove the signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
